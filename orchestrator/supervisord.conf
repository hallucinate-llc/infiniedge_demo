[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# HTTP Gateway (Fallback Proxy)
[program:gateway]
command=/app/scripts/start-gateway.sh
autostart=true
autorestart=true
priority=100
environment=PORT=80,HOST=0.0.0.0
stdout_logfile=/app/logs/gateway.log
stderr_logfile=/app/logs/gateway.log

# AegisEdgeAI Service
[program:aegis-edge-ai]
command=/app/scripts/start-aegis.sh
directory=/app/services/aegis-edge-ai
autostart=true
autorestart=true
priority=200
environment=PORT=8080,HOST=0.0.0.0
stdout_logfile=/app/logs/aegis.log
stderr_logfile=/app/logs/aegis.log

# SPEAR Service
[program:spear]
command=/app/scripts/start-spear.sh
directory=/app/services/spear
autostart=true
autorestart=true
priority=200
environment=PORT=8081,HOST=0.0.0.0,PATH="/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",GOPATH="/go",GOROOT="/usr/local/go"
stdout_logfile=/app/logs/spear.log
stderr_logfile=/app/logs/spear.log

# YoMo Service
[program:yomo]
command=/app/scripts/start-yomo.sh
