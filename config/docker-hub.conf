# InfiniteEdge Docker Hub Configuration

## Docker Hub Organization
DOCKER_HUB_ORG=hallucinate

## Image Configuration
IMAGE_BASE_NAME=infiniteedge
DEFAULT_VERSION=v1.0.0

## Supported Architectures
SUPPORTED_ARCHITECTURES=(amd64 arm64)

## Container Registry
REGISTRY_URL=docker.io
REGISTRY_NAMESPACE=hallucinate

## Build Configuration
BUILD_CONTEXT=.
MAIN_DOCKERFILE=orchestrator/Dockerfile

## Submodule Containers
declare -A SUBMODULE_CONTAINERS=(
    ["orchestrator"]="orchestrator/Dockerfile"
    ["aegis-edge-ai"]="AegisEdgeAI/Dockerfile.simple"
    ["aegis-compliance"]="AegisEdgeAI/compliance_agent/Dockerfile"
    ["spear"]="SPEAR/Dockerfile"
    ["shifu"]="shifu/dockerfiles/shifu/Dockerfile"
    ["yomo"]="yomo/Dockerfile"
    ["transformers"]="transformers/Dockerfile"
    ["whisper"]="Whisper-Finetune/Dockerfile"
    ["megatron"]="Megatron-LM/Dockerfile"
    ["aiops"]="AIOps/Dockerfile"
)

## Docker Hub Repositories
DOCKER_HUB_REPOS=(
    "infiniteedge-orchestrator"
    "infiniteedge-aegis-ai"
    "infiniteedge-compliance"
    "infiniteedge-spear"
    "infiniteedge-shifu" 
    "infiniteedge-yomo"
    "infiniteedge-transformers"
    "infiniteedge-whisper"
    "infiniteedge-megatron"
    "infiniteedge-aiops"
)

## Default Tags
DEFAULT_TAGS=(
    "latest"
    "v1.0.0"
    "stable"
)

## Architecture-specific Tags
ARCH_TAGS=(
    "latest-amd64"
    "latest-arm64"
    "v1.0.0-amd64"
    "v1.0.0-arm64"
)

## Multi-arch Manifest Tags
MANIFEST_TAGS=(
    "latest"
    "v1.0.0"
    "stable"
)

## Build Arguments
BUILD_ARGS=(
    "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    "VCS_REF=$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
    "VCS_URL=$(git config --get remote.origin.url 2>/dev/null || echo 'unknown')"
    "VERSION=$DEFAULT_VERSION"
    "ORGANIZATION=hallucinate-llc"
)

## Test Configuration
TEST_TIMEOUT=300
TEST_HEALTH_ENDPOINT="/health"
TEST_API_ENDPOINT="/api/v1/status"
TEST_PORTS=(8080 8081 8082 8083)

## Deployment Configuration
DEPLOYMENT_ENVIRONMENT=production
DEPLOYMENT_REGION=us-east-1
DEPLOYMENT_REPLICAS=3

## Security Configuration
SECURITY_SCAN_ENABLED=true
VULNERABILITY_THRESHOLD=high
SECURITY_POLICIES=(
    "no-root-user"
    "read-only-filesystem"
    "drop-capabilities"
    "run-as-non-root"
)

## Monitoring Configuration
MONITORING_ENABLED=true
METRICS_PORT=9090
HEALTH_CHECK_INTERVAL=30s
HEALTH_CHECK_TIMEOUT=10s
HEALTH_CHECK_RETRIES=3

## Logging Configuration
LOG_LEVEL=info
LOG_FORMAT=json
LOG_OUTPUT=stdout

## Resource Limits
CPU_LIMIT=2000m
MEMORY_LIMIT=4Gi
CPU_REQUEST=500m
MEMORY_REQUEST=1Gi

## Environment Variables
ENVIRONMENT_VARIABLES=(
    "NODE_ENV=production"
    "LOG_LEVEL=info"
    "METRICS_ENABLED=true"
    "HEALTH_CHECK_ENABLED=true"
)

## Labels
DOCKER_LABELS=(
    "org.opencontainers.image.title=InfiniteEdge"
    "org.opencontainers.image.description=Edge AI Computing Platform"
    "org.opencontainers.image.vendor=hallucinate-llc"
    "org.opencontainers.image.licenses=MIT"
    "org.opencontainers.image.documentation=https://github.com/hallucinate-llc/infiniteedge"
    "org.opencontainers.image.source=https://github.com/hallucinate-llc/infiniteedge"
)

## Notification Configuration
NOTIFICATION_ENABLED=true
NOTIFICATION_WEBHOOK_URL=""
NOTIFICATION_CHANNELS=(
    "slack"
    "email"
    "github"
)

## Cleanup Configuration
CLEANUP_OLD_IMAGES=true
KEEP_LAST_N_IMAGES=10
CLEANUP_INTERVAL=daily