name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      architecture:
        description: 'Target architecture'
        required: true
        type: string
      component:
        description: 'Component to build'
        required: true
        type: string
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      push_image:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: true
      run_tests:
        description: 'Run component tests'
        required: false
        type: boolean
        default: true
    outputs:
      image_tag:
        description: 'Built image tag'
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: 'Image digest'
        value: ${{ jobs.build.outputs.image_digest }}
      test_results:
        description: 'Test results'
        value: ${{ jobs.test.outputs.test_results }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ inputs.component }} (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-latest' || 'ubuntu-latest' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || 'linux/amd64' }}

      - name: Set up QEMU
        if: inputs.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to Container Registry
        if: inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-${{ inputs.architecture }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.component }}-${{ inputs.architecture }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}-${{ inputs.architecture }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.component }},push=${{ inputs.push_image }}

      - name: Generate build summary
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Component:** ${{ inputs.component }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** ${{ inputs.architecture }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $(docker image inspect ${{ steps.meta.outputs.tags }} --format='{{.Size}}' | numfmt --to=iec 2>/dev/null || echo 'Unknown')" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test ${{ inputs.component }} (${{ inputs.architecture }})
    runs-on: ubuntu-latest
    needs: [build]
    if: inputs.run_tests
    outputs:
      test_results: ${{ steps.test.outputs.results }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: inputs.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run component tests
        id: test
        run: |
          # Create test configuration
          cat > test-config.yml << EOF
          version: '3.8'
          services:
            test-${{ inputs.component }}:
              image: ${{ needs.build.outputs.image_tag }}
              platform: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
              environment:
                - COMPONENT_NAME=${{ inputs.component }}
                - ARCHITECTURE=${{ inputs.architecture }}
                - TEST_MODE=true
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 3
          EOF
          
          # Start test container
          docker-compose -f test-config.yml up -d
          
          # Wait for health check
          timeout 60 bash -c 'while ! docker-compose -f test-config.yml ps | grep -q "Up (healthy)"; do sleep 5; done' || {
            echo "Health check failed, showing logs:"
            docker-compose -f test-config.yml logs
            exit 1
          }
          
          # Run tests based on component
          case "${{ inputs.component }}" in
            "orchestrator")
              # Test orchestrator functionality
              curl -f http://localhost:8888/health
              curl -f http://localhost:8888/api/v1/status
              echo "results=orchestrator_tests_passed" >> $GITHUB_OUTPUT
              ;;
            "aegis-edge-ai")
              # Test AegisEdgeAI functionality
              curl -f http://localhost:8080/health
              echo "results=aegis_tests_passed" >> $GITHUB_OUTPUT
              ;;
            *)
              # Generic tests
              curl -f http://localhost:8080/health || curl -f http://localhost/health
              echo "results=generic_tests_passed" >> $GITHUB_OUTPUT
              ;;
          esac
          
          # Cleanup
          docker-compose -f test-config.yml down -v

      - name: Upload test artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ inputs.component }}-${{ inputs.architecture }}
          path: |
            test-results/
            logs/

  security-scan:
    name: Security Scan ${{ inputs.component }} (${{ inputs.architecture }})
    runs-on: ubuntu-latest
    needs: [build]
    if: inputs.push_image
    
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results-${{ inputs.component }}-${{ inputs.architecture }}.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results-${{ inputs.component }}-${{ inputs.architecture }}.sarif'
          category: 'trivy-${{ inputs.component }}-${{ inputs.architecture }}'
