# Hardened Nginx Configuration
user nginx;
worker_processes auto;
pid /var/run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Security and performance settings
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Security settings
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Upstream definitions
    upstream aegis_backend {
        server aegis-edge-ai:5000 max_fails=3 fail_timeout=30s;
        server aegis-edge-ai:5001 max_fails=3 fail_timeout=30s backup;
        server aegis-edge-ai:5002 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }
    
    upstream spear_backend {
        server spear-platform:9090 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    upstream yomo_backend {
        server yomo-serverless:9000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name localhost;
        
        ssl_certificate /run/secrets/ssl_cert;
        ssl_certificate_key /run/secrets/ssl_key;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        
        # Main dashboard
        location / {
            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 InfinieEdge Demo - Secure Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 3rem; margin-bottom: 10px; }
        .security-badge { 
            background: #2ecc71; padding: 5px 15px; border-radius: 20px; 
            font-size: 0.8rem; display: inline-block; margin: 10px 0;
        }
        .services { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 25px; margin-bottom: 40px;
        }
        .service {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 15px;
            padding: 25px; transition: all 0.3s ease;
        }
        .service:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .service h3 { color: #fff; margin-bottom: 10px; display: flex; align-items: center; }
        .service .status { 
            background: #2ecc71; color: white; padding: 3px 8px; 
            border-radius: 12px; font-size: 0.7rem; margin-left: auto;
        }
        .service p { opacity: 0.9; margin-bottom: 15px; line-height: 1.5; }
        .service a { 
            color: #64ffda; text-decoration: none; margin-right: 12px;
            padding: 5px 10px; background: rgba(100,255,218,0.1);
            border-radius: 5px; font-size: 0.85rem;
        }
        .service a:hover { background: rgba(100,255,218,0.2); }
        .security-info {
            background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3);
            border-radius: 10px; padding: 20px; margin-top: 30px;
        }
        .security-info h3 { color: #2ecc71; margin-bottom: 15px; }
        .security-features { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
        }
        .feature { display: flex; align-items: center; }
        .feature::before { content: "✅"; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 InfinieEdge Demo Platform</h1>
            <div class="security-badge">🛡️ HARDENED & SECURED</div>
            <p>Production-ready edge AI platform with enterprise security</p>
        </div>
        
        <div class="services">
            <div class="service">
                <h3>🛡️ AegisEdgeAI <span class="status">SECURED</span></h3>
                <p>Verifiable trust for AI at the edge with hardware TPM security</p>
                <a href="/aegis/">Dashboard</a><a href="/aegis/api">API</a>
            </div>
            
            <div class="service">
                <h3>🤖 SPEAR Platform <span class="status">SECURED</span></h3>
                <p>Distributed AI agents with secure container isolation</p>
                <a href="/spear/">Management</a><a href="/spear/api">API</a>
            </div>
            
            <div class="service">
                <h3>⚡ YoMo Framework <span class="status">SECURED</span></h3>
                <p>Serverless edge computing with encrypted communication</p>
                <a href="/yomo/">Dashboard</a><a href="/yomo/api">API</a>
            </div>
            
            <div class="service">
                <h3>📊 Monitoring <span class="status">ACTIVE</span></h3>
                <p>Real-time security monitoring and performance metrics</p>
                <a href="/prometheus/">Prometheus</a><a href="/grafana/">Grafana</a>
            </div>
        </div>
        
        <div class="security-info">
            <h3>🔒 Security Features Enabled</h3>
            <div class="security-features">
                <div class="feature">TLS 1.3 Encryption</div>
                <div class="feature">Container Hardening</div>
                <div class="feature">Network Isolation</div>
                <div class="feature">Security Scanning</div>
                <div class="feature">Access Controls</div>
                <div class="feature">Audit Logging</div>
                <div class="feature">Resource Limits</div>
                <div class="feature">Health Monitoring</div>
            </div>
        </div>
    </div>
</body>
</html>';
            add_header Content-Type text/html;
        }
        
        # AegisEdgeAI routes with rate limiting
        location /aegis/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://aegis_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # SPEAR routes
        location /spear/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://spear_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # YoMo routes
        location /yomo/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://yomo_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Monitoring endpoints
        location /prometheus/ {
            auth_basic "Monitoring Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    
    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name localhost;
        
        # Allow health checks
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
}