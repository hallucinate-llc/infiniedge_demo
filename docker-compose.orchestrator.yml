version: '3.8'

services:
  infiniteedge-orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.working
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VERSION=${VERSION:-v1.0.0}
        - VCS_REF=${VCS_REF:-$(git rev-parse --short HEAD)}
    container_name: infiniteedge-orchestrator
    hostname: infiniteedge-orchestrator
    restart: unless-stopped
    
    # Port mappings for all services
    ports:
      # HTTP Gateway and Health Dashboard
      - "8888:80"
      # Individual service ports
      - "8080:8080"  # AegisEdgeAI
      - "8081:8081"  # SPEAR
      - "8082:8082"  # YoMo
      - "8083:8083"  # Shifu
      - "8084:8084"  # AIOps
      - "8085:8085"  # EDA
      - "8086:8086"  # EdgeWhisper
      - "8087:8087"  # WhisperFinetune
      - "8088:8088"  # MegatronLM
      - "8089:8089"  # Transformers
      # Additional ports for streaming and monitoring
      - "9000:9000"  # YoMo Zipper
      - "9001:9001"  # Metrics
      - "9002:9002"  # Additional services
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app
      - GOPATH=/go
      - GOROOT=/usr/local/go
      - PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/go/bin
      
      # Service configuration
      - AEGIS_PORT=8080
      - SPEAR_PORT=8081
      - YOMO_PORT=8082
      - SHIFU_PORT=8083
      - AIOPS_PORT=8084
      - EDA_PORT=8085
      - EDGE_WHISPER_PORT=8086
      - WHISPER_FINETUNE_PORT=8087
      - MEGATRON_PORT=8088
      - TRANSFORMERS_PORT=8089
      
      # Health monitoring
      - HEALTH_PORT=80
      - HEALTH_INTERVAL=30
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    
    # Volume mounts for persistence and configuration
    volumes:
      # Logs
      - infiniteedge-logs:/app/logs
      - infiniteedge-supervisor-logs:/var/log/supervisor
      
      # Data persistence
      - infiniteedge-data:/app/data
      
      # Configuration
      - infiniteedge-config:/app/configs
      
      # Optional: mount host directories for development
      # - ./orchestrator/configs:/app/configs:ro
      # - ./logs:/app/logs
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network configuration
    networks:
      - infiniteedge-network
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Labels for monitoring and management
    labels:
      - "com.infiniteedge.service=orchestrator"
      - "com.infiniteedge.version=v1.0.0"
      - "com.infiniteedge.description=InfiniteEdge All-in-One Orchestrator"
      - "traefik.enable=true"
      - "traefik.http.routers.infiniteedge.rule=Host(`infiniteedge.local`)"
      - "traefik.http.services.infiniteedge.loadbalancer.server.port=80"

# Named volumes for data persistence
volumes:
  infiniteedge-logs:
    driver: local
    labels:
      - "com.infiniteedge.volume=logs"
      
  infiniteedge-supervisor-logs:
    driver: local
    labels:
      - "com.infiniteedge.volume=supervisor-logs"
      
  infiniteedge-data:
    driver: local
    labels:
      - "com.infiniteedge.volume=data"
      
  infiniteedge-config:
    driver: local
    labels:
      - "com.infiniteedge.volume=config"

# Network configuration
networks:
  infiniteedge-network:
    driver: bridge
    name: infiniteedge-network
    labels:
      - "com.infiniteedge.network=main"